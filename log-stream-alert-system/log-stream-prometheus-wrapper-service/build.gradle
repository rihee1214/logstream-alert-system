plugins {
	id 'java'
	id 'io.spring.dependency-management' version '1.1.7'
}

description = '''\
A reactive alert gateway that receives Prometheus alerts, applies custom policies, and forwards them to AlertManager or a fallback notification service.
(Prometheus 알림을 수신한 뒤, 사용자 정의 정책에 따라 AlertManager 또는 NotificationService로 전달하는 반응형 게이트웨이 컴포넌트입니다.)
'''

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webflux'

	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'io.projectreactor:reactor-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	test.useJUnitPlatform()
}
