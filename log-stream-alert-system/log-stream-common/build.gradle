plugins {
    id 'java'
}

description = '''\
Shared utility and base components for alerting system. Includes DTOs, constants, exceptions, and common interfaces.
(알림 시스템을 위한 공용 유틸리티 및 기반 컴포넌트. DTO, 상수, 예외, 공통 인터페이스를 포함)
'''

dependencies {

    // Json 메시지를 파싱하거나 만들 때 사용하는 라이브러리
    implementation "com.fasterxml.jackson.core:jackson-core:${jacksonDatabindVersion}"
    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonDatabindVersion}"
    // 주석에 들어가는 MDC에 대한 내용을 넣어주기 위한 용도
    implementation "org.slf4j:slf4j-api:${log4jVersion}"
}