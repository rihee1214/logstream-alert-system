plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.4' apply false
    id 'io.spring.dependency-management' version '1.1.7'
}

description = '''\
Shared utility and base components for alerting system. Includes DTOs, constants, exceptions, and common interfaces.
(알림 시스템을 위한 공용 유틸리티 및 기반 컴포넌트. DTO, 상수, 예외, 공통 인터페이스를 포함)
'''

dependencies {
    // prometheus를 이용하여 application health를 체크하기 위한 dependency
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // log를 찍을때, json 형식으로 찍히도록 처리하는 dependency
    implementation "net.logstash.logback:logstash-logback-encoder:${logstashEncoderVersion}"
    // AOP 전용 모듈
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    // Web core (tomcat 없이 web 기능만)
    implementation 'org.springframework:spring-webmvc'
    // http servlet용
    implementation "jakarta.servlet:jakarta.servlet-api:${jakartaServletApiVersion}"
    // WebClient 전용 (Actuator 기반 health, metric 정보 수집용)
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    // Actuator 접근을 localhost 에서만 가능하도록 제어하기 위한 dependency
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // 테스트에서만 Spring Boot Web 서버 환경 사용
    testImplementation 'org.springframework.boot:spring-boot-starter-web'
}

// 테스트 코드 전용 java 옵션, 환경변수 세팅
test {
    useJUnitPlatform()
    systemProperty "service.name", "common"
    environment "HOST", "localhost"
    environment "CONTAINER", "local-container"
    environment "monitoring.token", "test-token"
    jvmArgs += ["-XX:+EnableDynamicAgentLoading"]
}

// IDE에서 테스트 실행 시 Actuator 설정 파일(metric-config.properties)을 자동 생성하여
// 실제 운영 환경과 유사한 메트릭 구성이 적용되도록 함 (test classpath에 포함되도록 처리)

// metric-config.properties 생성 경로 설정
def generatedMetricConfigPath = layout.buildDirectory.file("generated-config/metric-config.properties")
// 설정 파일 생성 task
tasks.register("generateMetricConfig") {
    doLast {
        def file = file(generatedMetricConfigPath)
        file.parentFile.mkdirs()
        file.text = """
            metrics.failure.threshold=0.3
            metrics.target.jvm.memory.used=true
            metrics.target.jvm.memory.max=true
            metrics.target.system.cpu.usage=true
            metrics.target.process.uptime=true
            metrics.target.http.server.requests=true
            metrics.target.jvm.gc.pause=true
        """.stripIndent()
    }
}
// 생성된 설정 파일을 테스트 리소스 경로로 복사 (IDE 테스트 실행 시 classpath에 포함되도록 처리)
tasks.register("copyMetricConfig", Copy) {
    from(layout.buildDirectory.dir("generated-config"))
    into(layout.buildDirectory.dir("resources/test")) // IDE 실행 시 classpath에 포함됨
}
// 테스트 실행 시 설정 파일이 항상 준비되도록 의존성 연결
tasks.named("test") {
    dependsOn("generateMetricConfig", "copyMetricConfig")
}
// processTestResources 실행 시에도 파일 복사가 선행되도록 설정 (classpath 포함 목적)
tasks.named("processTestResources") {
    dependsOn("copyMetricConfig")
}