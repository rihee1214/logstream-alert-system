worker.thread.count=8
worker.processors=collect,validate,persist

# Collectors Setting
collector.type=kafka
kafka.bootstrap.servers=localhost:9092
kafka.topic=log_topic
kafka.group.id=logging-worker
kafka.enable.auto.commit=false
kafka.auto.offset.reset=earliest
kafka.max.poll.records=100
kafka.max.poll.timeout=5000
kafka.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
kafka.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer

validator.type=default
persistence.type=postgres