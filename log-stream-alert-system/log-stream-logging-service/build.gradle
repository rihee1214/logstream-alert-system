plugins {
    id 'java'
    id 'com.no-spring-test-conventions'
}

description = '''\
Central log processor that stores logs and triggers alerts for critical events
(Kafka에서 로그를 수신하고, 처리하고, 영속 저장소에 저장하는 로직을 담은 서비스)
'''

dependencies {
    annotationProcessor project(":log-stream-logging-service:Annotation-Processor")
    testAnnotationProcessor project(":log-stream-logging-service:Annotation-Processor")

    implementation project(":log-stream-logging-service:Annotation-Processor")
    // 전체 프로젝트에서 공통적으로 사용되는 로그 구조 같은 요소들을 모아넣은 project
    implementation project(':log-stream-common')

    // 로그 데이터를 가져오기 위한 kafka client
    implementation "org.apache.kafka:kafka-clients:${kafkaClientsVersion}"
    // 영속성 저장소에 저장하기 위한 postgres 데이터베이스 client
    implementation "org.postgresql:postgresql:${postgresqlClientsVersion}"
    // 영속성 저장소에 저장하기 위해 사용하는 java database interface
    implementation "org.jdbi:jdbi3-core:${jdbiVersion}"
    // Connection Pool 관리를 위한 hikariCP
    implementation "com.zaxxer:HikariCP:${hikariCpVersion}"

    // 로깅을 위한 라이브러리
    implementation "org.slf4j:slf4j-api:${log4jVersion}"
    implementation "org.apache.logging.log4j:log4j-slf4j-impl:${log4jImplVersion}"
    implementation "org.apache.logging.log4j:log4j-core:${log4jImplVersion}"

    // annotation scan 후 적절한 class 찾아주는 용도
    implementation "io.github.classgraph:classgraph:${classPathScannerVersion}"

    runtimeOnly "ch.qos.logback:logback-classic:${logbackVersion}"

    testImplementation "org.mockito:mockito-core:${mockitoVersion}"
    testImplementation "org.mockito:mockito-inline:${mockitoInlineVersion}" // static/final 모킹
}

/**
 * 핵심 아이디어
 *  - 어노테이션 프로세서가 JSON을 빌드 시점에 다음 디렉터리에 생성하게 한다:
 *      build/generated-resources/main/...
 *      build/generated-resources/test/...
 *  - 그 디렉터리를 각 sourceSet의 resources 경로에 추가한다.
 *  - processResources가 compileJava 이후에 해당 디렉터리에서 파일을 집어오도록 보장한다.
 */
def genResDirMain = layout.buildDirectory.dir('generated-resources/main').get().asFile
def genResDirTest = layout.buildDirectory.dir('generated-resources/test').get().asFile

sourceSets {
    main {
        // 기본값: src/main/resources (유지)
        resources {
            srcDir 'src/main/resources'
            // 프로세서 산출물(운영용)을 리소스에 포함
            srcDir genResDirMain
        }
    }
    test {
        // 기본값: src/test/resources (유지)
        resources {
            srcDir 'src/test/resources'
            // 프로세서 산출물(테스트용)을 리소스에 포함
            srcDir genResDirTest
        }

        // (참고) 테스트 클래스패스는 기본적으로 test → main 순서라
        // 동일 경로 리소스가 있으면 test 쪽이 우선적으로 로딩됨.
        // 필요시 아래처럼 명시적으로 확인 가능하지만 보통 필요 없음.
        // runtimeClasspath = files(output, resources, compileClasspath, sourceSets.main.output)
    }
}

/**
 * 리소스 패키징 순서 보장:
 * - 어노테이션 프로세서가 컴파일 타임에 실행되므로,
 *   processResources가 compileJava 이후에 산출물을 집도록 dependsOn을 건다.
 */
tasks.named('processResources') {
    dependsOn tasks.named('compileJava')
}

tasks.named('processTestResources') {
    dependsOn tasks.named('compileTestJava')
}


tasks.withType(Test).configureEach {
    useJUnitPlatform()

    systemProperty 'logging.props', file('build/resources/test/logging.properties').absolutePath

    // 환경 변수 설정
//    environment "VALIDATOR_MODE", "strict"
    environment "POSTGRES_CONNECT_PASSWORD", "password"

    // JVM 옵션
    jvmArgs += ["-XX:+EnableDynamicAgentLoading"]
}