plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.3'
    id 'io.spring.dependency-management' version '1.1.7'
}

description = '''\
Central log processor that stores logs and triggers alerts for critical events
(Kafka에서 로그를 수신하고, ScyllaDB에 저장하며, WARN/ERROR 로그를 알림 서비스로 전달하는 중앙 로그 처리 서비스)
'''

dependencies {
    // 전체 프로젝트에서 공통적으로 사용되는 로그 구조 같은 요소들을 모아넣은 project
    implementation project(':log-stream-common')

    implementation "com.scylladb:java-driver-core:${scyllaDBVersion}"
    implementation "com.scylladb:java-driver-query-builder:${scyllaDBVersion}"
    implementation "com.scylladb:java-driver-mapper-runtime:${scyllaDBVersion}"
    annotationProcessor "com.scylladb:java-driver-mapper-processor:${scyllaDBVersion}"

    implementation 'org.springframework.kafka:spring-kafka'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.kafka:spring-kafka-test'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
