plugins {
    id 'java'
    id 'eclipse'
    id 'io.spring.dependency-management' version '1.1.7' apply false
    // 컴파일시 규칙 위반을 잡기 위한 도구
    id 'checkstyle'
}

group = 'com.rihee.alerting'
version = '0.0.1-SNAPSHOT'
description = '''\
A centralized Spring Boot multi-module project designed to simulate log collection, event filtering, and asynchronous notifications through Kafka topics.
(MSA 기반 분산 로그 수집 및 경고 알림 시스템)
'''

repositories {
    mavenCentral()
}

tasks.named('check').configure {
    dependsOn 'checkstyleMain'
    dependsOn 'checkstyleTest'
}

subprojects { Project it ->
    apply plugin: 'java'
    apply plugin: 'eclipse'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    repositories {
        mavenCentral()
    }

    plugins.withId('java') {
        apply plugin: 'checkstyle'

        checkstyle {
            toolVersion = "${checkStyleVersion}"

            // ✅ Gradle 8+ 권장: TextResource로 구성 파일 지정
            config = resources.text.fromFile(rootProject.file('config/checkstyle/checkstyle.xml'))

            // SuppressionFilter에서 사용할 프로퍼티 주입 (절대경로 권장)
            configProperties = [
                    suppressionsFile: rootProject.file('config/checkstyle/suppressions.xml').absolutePath
            ]
            ignoreFailures = false   // 위반 시 빌드 실패
            maxWarnings = 0
            // showViolations = true  // (선택) 콘솔 출력 원하면 유지

            // 모든 Checkstyle 태스크 공통 리포트 설정 & 그룹 지정
            tasks.withType(Checkstyle).configureEach {
                group = 'verification'
                reports {
                    xml.required = false
                    html.required = true
                    html.outputLocation = layout.buildDirectory.file("reports/checkstyle/${name}.html")
                }
            }

            // 집계 check에 의존성 연결
            tasks.named('check').configure {
                dependsOn tasks.named('checkstyleMain'), tasks.named('checkstyleTest')
            }
        }
    }

    afterEvaluate {
        checkstyle.sourceSets = [sourceSets.main, sourceSets.test]
    }

    tasks.named('check').configure {
        dependsOn 'checkstyleMain', 'checkstyleTest'
    }
}