plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

description = '''\
Mock service that simulates log-generating applications for testing the distributed alerting system.
(Mock 서비스를 위한 로그 발생기)
'''

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:3.5.3"
    }
}

dependencies {
    // 전체 프로젝트에서 공통적으로 사용되는 로그 구조 같은 요소들을 모아넣은 project
    implementation project(':log-stream-common')
    // biz 로직을 수행하는 요소에 들어가서 로그 수집을 위한 정책 및 기반이 되어주는 project
    implementation project(':log-biz-standardizer')

    implementation 'org.springframework.boot:spring-boot-starter-web'

    // prometheus를 이용하여 application health를 체크하기 위한 dependency
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // WebClient 전용 (자체 service call용)
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    // 보안을 위한 dependency
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // 파라미터 Validation을 위한 dependency
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// 테스트 코드 전용 java 옵션, 환경변수 세팅
test {
    useJUnitPlatform()
    systemProperty "service.name", "mockup"
    systemProperty "spring.profiles.active", "dev"
    environment "HOST", "localhost"
    environment "CONTAINER", "local-container"
    environment "monitoring.token", "test-token"
    environment "mockup.token", "test-token"
    jvmArgs += ["-XX:+EnableDynamicAgentLoading"]
}